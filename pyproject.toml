[project]
name = "inbox-agent"
version = "0.1.0"
description = "An AI agent that triages a Gmail inbox: reads, labels and drafts replies for you to approve. It never sends."
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2",
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "jinja2",
  "python-multipart",
  "google-api-python-client",
  "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
